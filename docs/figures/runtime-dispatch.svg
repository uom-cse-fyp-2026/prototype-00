<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 445" width="1040" height="445" role="img" aria-labelledby="title desc">
  <title id="title">Runtime dispatch for one projection</title>
  <desc id="desc">The current activation tensor goes through inspection and plan lookup. With every invocation, the runtime checks risk, cost and plan validity. An approved A8 choice uses INT8 activations, and the conservative choice uses BF16 activations. Both paths share packed W4 weights and produce FP32 output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="443" rx="22" fill="#f4f7fa" stroke="#d8e1ea" stroke-width="2"/>
  <g font-family="system-ui, Segoe UI, sans-serif" fill="#14283d">
    <text x="28" y="45" font-size="27" font-weight="700">Runtime dispatch for one projection</text>
    <g fill="#fff" stroke="#d6e0e9" stroke-width="1.5">
      <rect x="28" y="70" width="205" height="106" rx="13"/>
      <rect x="273" y="70" width="205" height="106" rx="13"/>
      <rect x="518" y="70" width="205" height="106" rx="13"/>
      <rect x="763" y="70" width="249" height="106" rx="13"/>
    </g>
    <g font-size="20" font-weight="700">
      <text x="46" y="106">Input</text>
      <text x="291" y="106">Inspector</text>
      <text x="536" y="106">Plan lookup</text>
      <text x="781" y="106">Select and validate</text>
    </g>
    <g font-size="16" fill="#334b61">
      <text x="46" y="137">FP32 activations</text>
      <text x="291" y="137">Measure magnitude</text>
      <text x="291" y="158">and clipping fraction</text>
      <text x="536" y="137">Match shape, policy</text>
      <text x="536" y="158">and input features</text>
      <text x="781" y="137">Check risk, cost and</text>
      <text x="781" y="158">plan validity on every call</text>
    </g>
    <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M236 123H267"/>
      <path d="M481 123H512"/>
      <path d="M726 123H757"/>
      <path d="M887 179V205H405V242"/>
      <path d="M851 205V242"/>
    </g>
    <rect x="410" y="214" width="203" height="25" rx="5" fill="#f4f7fa"/>
    <rect x="719" y="214" width="127" height="25" rx="5" fill="#f4f7fa"/>
    <g font-size="15" font-weight="650">
      <text x="417" y="232" fill="#16594e">A8 passes all checks</text>
      <text x="839" y="232" text-anchor="end" fill="#7a401d">Otherwise</text>
    </g>
    <rect x="244" y="246" width="322" height="82" rx="13" fill="#e2f2ed" stroke="#a5cdc2" stroke-width="1.5"/>
    <rect x="690" y="246" width="322" height="82" rx="13" fill="#fff0e1" stroke="#e7c6a8" stroke-width="1.5"/>
    <g font-size="21" font-weight="700">
      <text x="405" y="279" text-anchor="middle" fill="#16594e">W4 / A8</text>
      <text x="851" y="279" text-anchor="middle" fill="#7a401d">W4 / BF16</text>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="405" y="305">INT8 activations · INT32 group dots</text>
      <text x="851" y="305">BF16 activations · FP32 arithmetic</text>
    </g>
    <path d="M405 331V352H851V331" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M628 352V368" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="496" y="372" width="264" height="44" rx="11" fill="#18334c"/>
    <text x="628" y="400" font-size="19" font-weight="650" text-anchor="middle" fill="#fff">FP32 output</text>
    <text x="28" y="397" font-size="16" fill="#334b61">Both paths read the same packed W4 weights.</text>
  </g>
</svg>
